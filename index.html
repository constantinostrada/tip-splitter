<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Splitter</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #5f5f5a;
      --border: #c9c9c2;
      --accent: #1f6f5f;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .field { margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }
    label, legend { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="number"],
    input[type="text"] {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: inherit;
    }
    input[type="number"]:focus-visible,
    input[type="text"]:focus-visible,
    input[type="radio"]:focus-visible,
    input[type="checkbox"]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    input[aria-invalid="true"] { border-color: var(--error); }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    .options { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
    .option {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: normal;
      margin: 0;
    }
    .option:has(input:checked) {
      border-color: var(--accent);
      background: #e9f3f0;
    }
    .custom-tip { margin-top: 12px; }
    .custom-tip label { font-weight: normal; }
    .custom-tip .input-row { display: flex; align-items: center; gap: 8px; }
    .custom-tip input:disabled { background: var(--bg); color: var(--muted); cursor: not-allowed; }
    .switch {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0;
      cursor: pointer;
    }
    .switch input { width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }
    .error {
      display: block;
      min-height: 1.2em;
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--error);
    }
    .error:empty { display: none; }
    .results {
      margin-top: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .result {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
    }
    .result:last-of-type { border-bottom: 0; }
    .result-label { color: var(--muted); }
    .result-value {
      font-weight: 700;
      font-size: 1.25rem;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .result-value .line { display: block; }
    .note { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); text-align: right; }
    .note[hidden] { display: none; }
  </style>
</head>
<body>
  <h1>Tip Splitter</h1>
  <form id="tip-form" novalidate autocomplete="off">
    <div class="field">
      <label for="bill">Bill total</label>
      <input id="bill" name="bill" type="number" inputmode="decimal"
             min="0" step="0.01" aria-describedby="bill-error">
      <span id="bill-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="people">Number of people</label>
      <input id="people" name="people" type="number" inputmode="numeric"
             min="1" step="1" aria-describedby="people-error">
      <span id="people-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <div class="field">
      <fieldset>
        <legend>Tip</legend>
        <div class="options">
          <label class="option"><input type="radio" name="tip" value="10"> 10%</label>
          <label class="option"><input type="radio" name="tip" value="15" checked> 15%</label>
          <label class="option"><input type="radio" name="tip" value="20"> 20%</label>
          <label class="option"><input type="radio" name="tip" value="other"> Otro</label>
        </div>
        <div class="custom-tip">
          <label for="tip-custom">% de propina</label>
          <div class="input-row">
            <input id="tip-custom" name="tip-custom" type="text" inputmode="decimal"
                   placeholder="Ej.: 18 o 12,5" disabled aria-describedby="tip-custom-error">
            <span aria-hidden="true">%</span>
          </div>
          <span id="tip-custom-error" class="error" role="alert" aria-live="polite"></span>
        </div>
      </fieldset>
    </div>

    <div class="field">
      <label class="switch" for="round-up">
        <input id="round-up" name="round-up" type="checkbox" role="switch">
        Redondear por persona
      </label>
    </div>
  </form>

  <section id="results" class="results" aria-live="polite" aria-label="Resultados">
    <div class="result">
      <span id="tip-label" class="result-label">Propina</span>
      <span id="tip-amount" class="result-value">—</span>
    </div>
    <p id="tip-rate-note" class="note" hidden></p>
    <div class="result">
      <span class="result-label">Total con propina</span>
      <span id="total-amount" class="result-value">—</span>
    </div>
    <div class="result">
      <span class="result-label">Por persona</span>
      <span id="per-person" class="result-value"><span class="line">—</span></span>
    </div>
    <p id="per-person-note" class="note" hidden></p>
  </section>

  <script src="app.js" defer></script>
</body>
</html>
