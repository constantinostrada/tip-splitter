<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tip Splitter</title>
  <style>
    :root {
      --bg: #f6f6f4;
      --card: #ffffff;
      --text: #1d1d1b;
      --muted: #5f5f5a;
      --border: #c9c9c2;
      --accent: #1f6f5f;
      --error: #b3261e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.4;
      color: var(--text);
      background: var(--bg);
      padding: 16px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 { font-size: 1.5rem; margin: 0 0 16px; }
    form {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }
    .field { margin-bottom: 20px; }
    .field:last-child { margin-bottom: 0; }
    label, legend { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="number"] {
      width: 100%;
      font: inherit;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fff;
      color: inherit;
    }
    input[type="number"]:focus-visible,
    input[type="radio"]:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }
    input[aria-invalid="true"] { border-color: var(--error); }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    .options { display: flex; gap: 8px; flex-wrap: wrap; }
    .option {
      flex: 1 1 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-weight: normal;
      margin: 0;
    }
    .option:has(input:checked) {
      border-color: var(--accent);
      background: #e9f3f0;
    }
    .error {
      display: block;
      min-height: 1.2em;
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--error);
    }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <h1>Tip Splitter</h1>
  <form id="tip-form" novalidate autocomplete="off">
    <div class="field">
      <label for="bill">Bill total</label>
      <input id="bill" name="bill" type="number" inputmode="decimal"
             min="0" step="0.01" aria-describedby="bill-error">
      <span id="bill-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <div class="field">
      <label for="people">Number of people</label>
      <input id="people" name="people" type="number" inputmode="numeric"
             min="1" step="1" aria-describedby="people-error">
      <span id="people-error" class="error" role="alert" aria-live="polite"></span>
    </div>

    <div class="field">
      <fieldset>
        <legend>Tip</legend>
        <div class="options">
          <label class="option"><input type="radio" name="tip" value="10"> 10%</label>
          <label class="option"><input type="radio" name="tip" value="15" checked> 15%</label>
          <label class="option"><input type="radio" name="tip" value="20"> 20%</label>
        </div>
      </fieldset>
    </div>
  </form>

  <script src="app.js" defer></script>
</body>
</html>
